<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Match - Live</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="game-screen-container">
        <header class="game-hud">
            <button id="back-to-dashboard-btn" class="hud-back-btn">Exit Match</button>
            <div class="turn-indicator">
                <span>Current Turn: </span>
                <strong id="current-player-turn" class="turn-red">Red Player</strong>
            </div>
        </header>

        <main class="game-arena">
            <div class="ludo-board-wrapper" id="ludo-board">
                </div>

            <div class="game-controls-sidebar">
                <div class="dice-box">
                    <div class="dice-3d-scene">
                        <div id="cube" class="cube-dice">
                            <div class="cube-face front">⚀</div>
                            <div class="cube-face back">⚅</div>
                            <div class="cube-face right">⚁</div>
                            <div class="cube-face left">⚄</div>
                            <div class="cube-face top">⚂</div>
                            <div class="cube-face bottom">⚃</div>
                        </div>
                    </div>
                    <button id="roll-dice-btn" class="action-btn roll-btn">Roll Dice</button>
                </div>
                <div class="game-log">
                    <p class="log-entry">Welcome! 3D Hover tokens deployed to starting grids.</p>
                </div>
            </div>
        </main>
    </div>

    <script src="game.js"></script>
</body>
</html>
